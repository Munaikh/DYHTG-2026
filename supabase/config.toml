# CLI 2.117.0. private is deliberately absent from api.schemas.
project_id = "algorithm-arena"
[api]
enabled = true
port = 56321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 100
auto_expose_new_tables = false
[db]
port = 56322
shadow_port = 56320
major_version = 17
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = false
sql_paths = []
[realtime]
enabled = true
[studio]
enabled = false
[local_smtp]
enabled = false
[storage]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = true
minimum_password_length = 8
[auth.email]
enable_signup = true
[auth.sms]
enable_signup = false
[auth.rate_limit]
anonymous_users = 30
[analytics]
enabled = false
[edge_runtime]
enabled = false
