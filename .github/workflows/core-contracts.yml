name: Core contracts

on:
  pull_request:
    paths:
      - 'Packages/AlgorithmArenaCore/**'
      - 'contracts/**'
      - 'content/learning/**'
      - 'content/duel/**'
      - 'scripts/duel_prediction.mjs'
      - 'scripts/verify_duel_variety.mjs'
      - 'scripts/verify_search_fixtures.py'
      - 'scripts/verify_learning_content.py'
      - 'scripts/test_learning_store.*'
      - 'scripts/test_campus_routes.*'
      - 'DYHTG-2026/Visualization/**'
      - 'DYHTG-2026/Adventure/Services/LearningStore.swift'
      - '.github/workflows/core-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'Packages/AlgorithmArenaCore/**'
      - 'contracts/**'
      - 'content/learning/**'
      - 'content/duel/**'
      - 'scripts/duel_prediction.mjs'
      - 'scripts/verify_duel_variety.mjs'
      - 'scripts/verify_search_fixtures.py'
      - 'scripts/verify_learning_content.py'
      - 'scripts/test_learning_store.*'
      - 'scripts/test_campus_routes.*'
      - 'DYHTG-2026/Visualization/**'
      - 'DYHTG-2026/Adventure/Services/LearningStore.swift'
      - '.github/workflows/core-contracts.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift toolchain
        run: swift --version
      - name: Test core, mock service, and checked-in JSON fixtures
        run: swift test --package-path Packages/AlgorithmArenaCore
      - name: Test learning persistence, reward retries and nickname ownership
        run: bash scripts/test_learning_store.sh
      - name: Test campus walking geometry and route loading lifecycle
        run: bash scripts/test_campus_routes.sh
      - name: Verify cross-language search and course fixtures
        run: python3 scripts/verify_search_fixtures.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Verify varied duels against an independent JS solver
        run: node scripts/verify_duel_variety.mjs
      - name: Verify authored learning content independently
        run: python3 -B scripts/verify_learning_content.py
